name: fs
description: file storage but as external plugin
version: v2.0.0
connectors:
- type: importer
  executable: fs-importer
  homepage: https://github.com/PlakarKorp/integrations/tree/main/fs
  license: ISC
  protocols: [fs]
- type: exporter
  executable: fs-exporter
