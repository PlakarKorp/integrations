name: FS
display_name: File System
description: file storage but as external plugin
homepage: https://github.com/PlakarKorp/integrations/tree/main/fs
license: ISC
api_version: v1.1.0
connectors:
- type: importer
  executable: fs-importer
  validator: ./plugin/importer/fs.json
  protocols: [fs]
- type: exporter
  executable: fs-exporter
  validator: ./plugin/exporter/fs.json
  protocols: [fs]
# storage is kept out because we don't want fs storage on PCP
# the way we handle this exception might change in the future
