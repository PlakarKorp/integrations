name: notion
display_name: Notion
description: Back up and restore Notion workspaces, pages, databases, files, comments and views.
api_version: v1.1.0
tier: official
homepage: https://github.com/PlakarKorp/integrations/tree/main/notion
license: ISC
contact: mailto:help@plakar.io
connectors:
- type: importer
  executable: notion-importer
  protocols: [notion]
  validator: ./plugin/importer/notion.json
  class: service
- type: exporter
  executable: notion-exporter
  protocols: [notion]
  validator: ./plugin/exporter/notion.json
  class: service
