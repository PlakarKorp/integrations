name: caldav
display_name: CalDAV
description: Integration providing import and export capabilities to CalDAV servers.
connectors:
  - type: importer
    executable: importer-caldav
    protocols: [caldav]
    validator: ./importer/schema.json
  - type: exporter
    executable: exporter-caldav
    protocols: [caldav]
    validator: ./exporter/schema.json
