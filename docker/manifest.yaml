name: docker
display_name: Docker
description: Integration providing backup and restore of docker images, networks, volumes and containers.
homepage: https://github.com/PlakarKorp/integrations/tree/main/docker
license: ISC
connectors:
- type: importer
  executable: dockerImporter
  protocols: [docker, docker+compose, docker+container, docker+image]
  validator: ./plugin/importer/schema.json
- type: exporter
  executable: dockerExporter
  protocols: [docker, docker+compose]
  validator: ./plugin/exporter/schema.json
