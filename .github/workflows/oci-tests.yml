name: oci tests

on:
  push:
    branches:
      - main
      - integration/oci
    paths:
      - .github/workflows/oci-tests.yml
      - 'oci/**'
  pull_request:
    paths:
      - .github/workflows/oci-tests.yml
      - 'oci/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: oci
      qa-version-file: oci/.qa-version
