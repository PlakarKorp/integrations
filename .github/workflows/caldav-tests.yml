name: caldav tests

on:
  push:
    branches:
      - main
      - integration/caldav
    paths:
      - .github/workflows/caldav-tests.yml
      - 'caldav/**'
  pull_request:
    paths:
      - .github/workflows/caldav-tests.yml
      - 'caldav/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: caldav
      qa-version-file: caldav/.qa-version
