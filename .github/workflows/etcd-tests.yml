name: etcd tests

on:
  push:
    branches:
      - main
      - integration/etcd
    paths:
      - .github/workflows/etcd-tests.yml
      - 'etcd/**'
  pull_request:
    paths:
      - .github/workflows/etcd-tests.yml
      - 'etcd/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: etcd
      qa-version-file: etcd/.qa-version
