name: etcd tests

on:
  push:
    branches:
      - main
      - integration/etcd
    paths:
      - .github/workflows/etcd-tests.yml
      - 'etcd/**'
  pull_request:
    paths:
      - .github/workflows/etcd-tests.yml
      - 'etcd/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: etcd
      qa-version-file: etcd/.qa-version
