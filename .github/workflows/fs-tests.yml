name: fs tests

on:
  push:
    branches:
      - integration/fs
    paths:
      - .github/workflows/fs-tests.yml
      - 'fs/**'
  pull_request:
    paths:
      - .github/workflows/fs-tests.yml
      - 'fs/**'
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fs
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: fs/go.mod

      - name: vet
        run: go vet -v ./...

      - name: Running tests
        run: go test -v ./...
