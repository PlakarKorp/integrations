name: sftp tests

on:
  push:
    branches:
      - main
      - integration/sftp
    paths:
      - .github/workflows/sftp-tests.yml
      - 'sftp/**'
  pull_request:
    paths:
      - .github/workflows/sftp-tests.yml
      - 'sftp/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: sftp
      qa-version-file: sftp/.qa-version
