name: sftp tests

on:
  push:
    branches:
      - main
      - integration/sftp
    paths:
      - .github/workflows/sftp-tests.yml
      - 'sftp/**'
  pull_request:
    paths:
      - .github/workflows/sftp-tests.yml
      - 'sftp/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: sftp
      qa-version-file: sftp/.qa-version
