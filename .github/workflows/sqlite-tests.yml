name: sqlite tests

on:
  push:
    branches:
      - main
      - integration/sqlite
    paths:
      - .github/workflows/sqlite-tests.yml
      - 'sqlite/**'
  pull_request:
    paths:
      - .github/workflows/sqlite-tests.yml
      - 'sqlite/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: sqlite
      qa-version-file: sqlite/.qa-version
