name: sqlite tests

on:
  push:
    branches:
      - main
      - integration/sqlite
    paths:
      - .github/workflows/sqlite-tests.yml
      - 'sqlite/**'
  pull_request:
    paths:
      - .github/workflows/sqlite-tests.yml
      - 'sqlite/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: sqlite
      qa-version-file: sqlite/.qa-version
