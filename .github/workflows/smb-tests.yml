name: smb tests

on:
  push:
    branches:
      - main
      - integration/smb
    paths:
      - .github/workflows/smb-tests.yml
      - 'smb/**'
  pull_request:
    paths:
      - .github/workflows/smb-tests.yml
      - 'smb/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: smb
      qa-version-file: smb/.qa-version
