name: k8s tests

on:
  push:
    branches:
      - main
      - integration/k8s
    paths:
      - .github/workflows/k8s-tests.yml
      - 'k8s/**'
  pull_request:
    paths:
      - .github/workflows/k8s-tests.yml
      - 'k8s/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: k8s
      qa-version-file: k8s/.qa-version
