name: k8s tests

on:
  push:
    branches:
      - main
      - integration/k8s
    paths:
      - .github/workflows/k8s-tests.yml
      - 'k8s/**'
  pull_request:
    paths:
      - .github/workflows/k8s-tests.yml
      - 'k8s/**'
  workflow_dispatch:

jobs:
  test:
    name: build and test the k8s integration
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: k8s/go.mod
          cache-dependency-path: k8s/go.sum

      - name: build
        working-directory: k8s
        run: go build ./...

      - name: test
        working-directory: k8s
        run: go test -race ./...
