name: k8s tests

on:
  push:
    branches:
      - main
      - integration/k8s
    paths:
      - .github/workflows/k8s-tests.yml
      - 'k8s/**'
  pull_request:
    paths:
      - .github/workflows/k8s-tests.yml
      - 'k8s/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: k8s
      qa-version-file: k8s/.qa-version
