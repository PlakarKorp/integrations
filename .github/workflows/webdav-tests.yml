name: webdav tests

on:
  push:
    branches:
      - main
      - integration/webdav
    paths:
      - .github/workflows/webdav-tests.yml
      - 'webdav/**'
  pull_request:
    paths:
      - .github/workflows/webdav-tests.yml
      - 'webdav/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: webdav
      qa-version-file: webdav/.qa-version
