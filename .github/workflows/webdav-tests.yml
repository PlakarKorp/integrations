name: webdav tests

on:
  push:
    branches:
      - main
      - integration/webdav
    paths:
      - .github/workflows/webdav-tests.yml
      - 'webdav/**'
  pull_request:
    paths:
      - .github/workflows/webdav-tests.yml
      - 'webdav/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: webdav
      qa-version-file: webdav/.qa-version
