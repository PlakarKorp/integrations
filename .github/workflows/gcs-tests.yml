name: gcs tests

on:
  push:
    branches:
      - main
      - integration/gcs
    paths:
      - .github/workflows/gcs-tests.yml
      - 'gcs/**'
  pull_request:
    paths:
      - .github/workflows/gcs-tests.yml
      - 'gcs/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: gcs
      qa-version-file: gcs/.qa-version
