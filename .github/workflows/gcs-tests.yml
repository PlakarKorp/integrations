name: gcs tests

on:
  push:
    branches:
      - main
      - integration/gcs
    paths:
      - .github/workflows/gcs-tests.yml
      - 'gcs/**'
  pull_request:
    paths:
      - .github/workflows/gcs-tests.yml
      - 'gcs/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: gcs
      qa-version-file: gcs/.qa-version
