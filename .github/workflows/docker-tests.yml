name: docker tests

on:
  push:
    branches:
      - main
      - integration/docker
    paths:
      - .github/workflows/docker-tests.yml
      - 'docker/**'
  pull_request:
    paths:
      - .github/workflows/docker-tests.yml
      - 'docker/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: docker
      qa-version-file: docker/.qa-version
