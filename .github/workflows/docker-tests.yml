name: docker tests

on:
  push:
    branches:
      - main
      - integration/docker
    paths:
      - .github/workflows/docker-tests.yml
      - 'docker/**'
  pull_request:
    paths:
      - .github/workflows/docker-tests.yml
      - 'docker/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: docker
      qa-version-file: docker/.qa-version
