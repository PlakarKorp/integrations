name: imap tests

on:
  push:
    branches:
      - main
      - integration/imap
    paths:
      - .github/workflows/imap-tests.yml
      - 'imap/**'
  pull_request:
    paths:
      - .github/workflows/imap-tests.yml
      - 'imap/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: imap
      qa-version-file: imap/.qa-version
