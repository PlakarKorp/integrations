name: imap tests

on:
  push:
    branches:
      - main
      - integration/imap
    paths:
      - .github/workflows/imap-tests.yml
      - 'imap/**'
  pull_request:
    paths:
      - .github/workflows/imap-tests.yml
      - 'imap/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: imap
      qa-version-file: imap/.qa-version
