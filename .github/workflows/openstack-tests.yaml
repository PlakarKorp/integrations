name: test openstack integration

on:
  push:
    branches:
      - main
      - integration/openstack-inventory
  pull_request:
    branches:
      - integration/openstack-inventory

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openstack

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: openstack/go.mod

      - name: Run tests
        run: make test
