name: example tests

on:
  push:
    branches:
      - main
      - integration/example
    paths:
      - .github/workflows/example-tests.yml
      - 'example/**'
  pull_request:
    paths:
      - .github/workflows/example-tests.yml
      - 'example/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@d668fafebd1fd750d529c9cf1256cd5d9d5264b8
    with:
      dir: example
      qa-version-file: example/.qa-version
