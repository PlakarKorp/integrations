name: azblob tests

on:
  push:
    branches:
      - main
      - integration/azblob
    paths:
      - .github/workflows/azblob-tests.yml
      - 'azblob/**'
  pull_request:
    paths:
      - .github/workflows/azblob-tests.yml
      - 'azblob/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: azblob
      qa-version-file: azblob/.qa-version
