name: s3 tests

on:
  push:
    branches:
      - main
      - integration/s3
    paths:
      - .github/workflows/s3-tests.yml
      - 's3/**'
  pull_request:
    paths:
      - .github/workflows/s3-tests.yml
      - 's3/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: s3
      qa-version-file: s3/.qa-version
