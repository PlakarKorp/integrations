name: s3 tests

on:
  push:
    branches:
      - main
      - integration/s3
    paths:
      - .github/workflows/s3-tests.yml
      - 's3/**'
  pull_request:
    paths:
      - .github/workflows/s3-tests.yml
      - 's3/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: s3
      qa-version-file: s3/.qa-version
