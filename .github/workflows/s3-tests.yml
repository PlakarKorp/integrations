name: s3 tests

on:
  push:
    branches:
      - main
      - integration/s3
    paths:
      - .github/workflows/s3-tests.yml
      - 's3/**'
  pull_request:
    paths:
      - .github/workflows/s3-tests.yml
      - 's3/**'
  workflow_dispatch:

jobs:
  test:
    name: build and test the s3 integration
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: s3/go.mod
          cache-dependency-path: s3/go.sum

      - name: build
        working-directory: s3
        run: go build ./...

      - name: test
        working-directory: s3
        run: go test -race ./...
