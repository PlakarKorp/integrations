name: mysql tests

on:
  push:
    branches:
      - main
      - integration/mysql
    paths:
      - .github/workflows/mysql-tests.yml
      - 'mysql/**'
  pull_request:
    paths:
      - .github/workflows/mysql-tests.yml
      - 'mysql/**'
  workflow_dispatch:

jobs:
  test:
    name: build and test the mysql integration
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: mysql/go.mod
          cache-dependency-path: mysql/go.sum

      - name: build
        working-directory: mysql
        run: go build ./...

      - name: test
        working-directory: mysql
        run: go test -race ./...
