name: mysql tests

on:
  push:
    branches:
      - main
      - integration/mysql
    paths:
      - .github/workflows/mysql-tests.yml
      - 'mysql/**'
  pull_request:
    paths:
      - .github/workflows/mysql-tests.yml
      - 'mysql/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: mysql
      qa-version-file: mysql/.qa-version
