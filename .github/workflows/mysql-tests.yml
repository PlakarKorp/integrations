name: mysql tests

on:
  push:
    branches:
      - main
      - integration/mysql
    paths:
      - .github/workflows/mysql-tests.yml
      - 'mysql/**'
  pull_request:
    paths:
      - .github/workflows/mysql-tests.yml
      - 'mysql/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: mysql
      qa-version-file: mysql/.qa-version
