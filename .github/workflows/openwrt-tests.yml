name: openwrt tests

on:
  push:
    branches:
      - main
      - integration/openwrt
    paths:
      - .github/workflows/openwrt-tests.yml
      - 'openwrt/**'
  pull_request:
    paths:
      - .github/workflows/openwrt-tests.yml
      - 'openwrt/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: openwrt
      qa-version-file: openwrt/.qa-version
