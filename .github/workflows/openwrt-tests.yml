name: openwrt tests

on:
  push:
    branches:
      - main
      - integration/openwrt
    paths:
      - .github/workflows/openwrt-tests.yml
      - 'openwrt/**'
  pull_request:
    paths:
      - .github/workflows/openwrt-tests.yml
      - 'openwrt/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: openwrt
      qa-version-file: openwrt/.qa-version
