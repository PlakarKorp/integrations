name: rsync tests

on:
  push:
    branches:
      - main
      - integration/rsync
    paths:
      - .github/workflows/rsync-tests.yml
      - 'rsync/**'
  pull_request:
    paths:
      - .github/workflows/rsync-tests.yml
      - 'rsync/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: rsync
      qa-version-file: rsync/.qa-version
