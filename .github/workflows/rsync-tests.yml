name: rsync tests

on:
  push:
    branches:
      - main
      - integration/rsync
    paths:
      - .github/workflows/rsync-tests.yml
      - 'rsync/**'
  pull_request:
    paths:
      - .github/workflows/rsync-tests.yml
      - 'rsync/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: rsync
      qa-version-file: rsync/.qa-version
