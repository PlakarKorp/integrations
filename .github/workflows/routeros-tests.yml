name: routeros tests

on:
  push:
    branches:
      - main
      - integration/routeros
    paths:
      - .github/workflows/routeros-tests.yml
      - 'routeros/**'
  pull_request:
    paths:
      - .github/workflows/routeros-tests.yml
      - 'routeros/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: routeros
      qa-version-file: routeros/.qa-version
