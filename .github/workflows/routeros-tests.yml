name: routeros tests

on:
  push:
    branches:
      - main
      - integration/routeros
    paths:
      - .github/workflows/routeros-tests.yml
      - 'routeros/**'
  pull_request:
    paths:
      - .github/workflows/routeros-tests.yml
      - 'routeros/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: routeros
      qa-version-file: routeros/.qa-version
