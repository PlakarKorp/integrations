name: ftp tests

on:
  push:
    branches:
      - main
      - integration/ftp
    paths:
      - .github/workflows/ftp-tests.yml
      - 'ftp/**'
  pull_request:
    paths:
      - .github/workflows/ftp-tests.yml
      - 'ftp/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: ftp
      qa-version-file: ftp/.qa-version
