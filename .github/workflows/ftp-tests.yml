name: ftp tests

on:
  push:
    branches:
      - main
      - integration/ftp
    paths:
      - .github/workflows/ftp-tests.yml
      - 'ftp/**'
  pull_request:
    paths:
      - .github/workflows/ftp-tests.yml
      - 'ftp/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: ftp
      qa-version-file: ftp/.qa-version
