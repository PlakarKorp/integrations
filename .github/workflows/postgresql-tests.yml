name: postgresql tests

on:
  push:
    branches:
      - main
      - integration/postgresql
    paths:
      - .github/workflows/postgresql-tests.yml
      - 'postgresql/**'
  pull_request:
    paths:
      - .github/workflows/postgresql-tests.yml
      - 'postgresql/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: postgresql
      qa-version-file: postgresql/.qa-version
