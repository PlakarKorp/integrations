name: postgresql tests

on:
  push:
    branches:
      - main
      - integration/postgresql
    paths:
      - .github/workflows/postgresql-tests.yml
      - 'postgresql/**'
  pull_request:
    paths:
      - .github/workflows/postgresql-tests.yml
      - 'postgresql/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: postgresql
      qa-version-file: postgresql/.qa-version
