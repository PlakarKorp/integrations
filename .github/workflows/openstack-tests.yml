name: openstack tests

on:
  push:
    branches:
      - main
      - integration/openstack
    paths:
      - .github/workflows/openstack-tests.yml
      - 'openstack/**'
  pull_request:
    paths:
      - .github/workflows/openstack-tests.yml
      - 'openstack/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: openstack
      qa-version-file: openstack/.qa-version
