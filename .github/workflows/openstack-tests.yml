name: openstack tests

on:
  push:
    branches:
      - main
      - integration/openstack
    paths:
      - .github/workflows/openstack-tests.yml
      - 'openstack/**'
  pull_request:
    paths:
      - .github/workflows/openstack-tests.yml
      - 'openstack/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@e1d3e18b756e233f591b013a1678eb61176f9f5d
    with:
      dir: openstack
      qa-version-file: openstack/.qa-version
