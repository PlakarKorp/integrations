name: rclone tests

on:
  push:
    branches:
      - main
      - integration/rclone
    paths:
      - .github/workflows/rclone-tests.yml
      - 'rclone/**'
  pull_request:
    paths:
      - .github/workflows/rclone-tests.yml
      - 'rclone/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@26877c5778b3486ddc561396c0ee92a4370621d0 # v1.0.0
    with:
      dir: rclone
      qa-version-file: rclone/.qa-version
