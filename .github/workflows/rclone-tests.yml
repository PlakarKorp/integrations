name: rclone tests

on:
  push:
    branches:
      - main
      - integration/rclone
    paths:
      - .github/workflows/rclone-tests.yml
      - 'rclone/**'
  pull_request:
    paths:
      - .github/workflows/rclone-tests.yml
      - 'rclone/**'
  workflow_dispatch:

jobs:
  qa:
    uses: PlakarKorp/QA/.github/workflows/integration.yml@3948eb6a452a193d48fcecb1d99ab173d81271bc # v1.0.1
    with:
      dir: rclone
      qa-version-file: rclone/.qa-version
