name: postgresql
display_name: PostgreSQL
description: Integration providing import and export capabilities for PostgreSQL databases.
api_version: v1.1.0
homepage: https://github.com/PlakarKorp/integrations/tree/main/postgresql
license: ISC
tier: official
contact: mailto:help@plakar.io
connectors:
  - type: importer
    executable: postgresqlImporter
    protocols: [postgres]
    validator: ./importer/schema.json
    class: database
    subclass: postgresql
  - type: importer
    executable: postgresqlBinImporter
    protocols: [postgres+bin]
    validator: ./binimporter/schema.json
    class: database
    subclass: postgresql
  - type: importer
    executable: postgresqlAWSImporter
    protocols: [postgres+aws]
    validator: ./awsimporter/schema.json
    class: database
    subclass: postgresql
  - type: exporter
    executable: postgresqlExporter
    protocols: [postgres]
    validator: ./exporter/schema.json
    class: database
    subclass: postgresql
  - type: exporter
    executable: postgresqlAWSExporter
    protocols: [postgres+aws]
    validator: ./awsexporter/schema.json
    class: database
    subclass: postgresql
