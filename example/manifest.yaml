name: example
display_name: Example
description: Example integration with an importer, an exporter and a storage backend
homepage: https://github.com/PlakarKorp/integrations/tree/main/example
license: ISC
connectors:
  - type: importer
    executable: ./example-importer
    validator: ./plugin/importer/schema.json
    protocols: [example]
    location_flags: [localfs]
  - type: exporter
    executable: ./example-exporter
    validator: ./plugin/exporter/schema.json
    protocols: [example]
    location_flags: [localfs]
  - type: storage
    executable: ./example-storage
    validator: ./plugin/storage/schema.json
    protocols: [example]
    location_flags: [localfs]
