name: openstack
display_name: OpenStack
description: OpenStack inventory of servers, volumes, images, Swift containers and Trove databases, and Cinder volume backup.
homepage: https://github.com/PlakarKorp/integrations/openstack
license: ISC
api_version: v1.1.0
connectors:
  - type: inventory
    executable: openstack-inventory
    validator: ./inventory/schema.json
    protocols: [openstack-inventory]
  - type: importer
    executable: openstack-block-importer
    validator: ./block/importer/schema.json
    protocols: [openstack-block]
    class: block-storage
